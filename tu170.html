<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU170 Mids Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --purple: #8b5cf6; --purple-hover: #7c3aed; --purple-light: #f5f3ff; --success: #10b981; --error: #ef4444; --bg: #f9fafb; --card-bg: #ffffff; --text-main: #111827; --text-muted: #6b7280; --border: #e5e7eb; --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05); --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1); --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; --border: #334155; --purple-light: #312e81; }
        * { box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .main-header { background: var(--card-bg); padding: 18px 30px; border-radius: 16px; box-shadow: var(--shadow-sm); text-align: center; position: relative; border: 1px solid var(--border); }
        .main-header h1 { margin: 0; color: var(--purple); font-size: 1.6rem; font-weight: 800; }
        .theme-toggle { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: var(--purple-light); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
        .chapter-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; grid-auto-rows: 1fr; }
        .menu-btn { background: var(--card-bg); border: 2px solid var(--border); border-radius: 16px; padding: 25px 20px; cursor: pointer; text-align: center; transition: all 0.2s; box-shadow: var(--shadow-sm); font-family: inherit; color: var(--text-main); }
        .menu-btn:hover { border-color: var(--purple); transform: translateY(-4px); box-shadow: var(--shadow-md); background: var(--purple-light); }
        .menu-btn h2 { margin: 0 0 8px 0; color: var(--purple); font-size: 1.25rem; font-weight: 800; }
        .menu-btn p { margin: 0; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
        .quiz-main { background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: var(--shadow-md); min-height: 500px; display: none; flex-direction: column; border: 1px solid var(--border); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; }
        .progress-text { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .live-score { font-size: 0.95rem; font-weight: 800; color: var(--purple); background: var(--purple-light); padding: 6px 14px; border-radius: 20px; }
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 30px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--purple), #a78bfa); width: 0%; transition: width 0.4s ease; }
        .question { font-size: 1.35rem; font-weight: 700; margin-bottom: 30px; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { padding: 18px 22px; border: 2px solid var(--border); border-radius: 14px; background: var(--card-bg); cursor: pointer; text-align: left; font-size: 1.05rem; font-weight: 500; color: var(--text-main); font-family: inherit; transition: all 0.2s; min-height: 55px; }
        .option-btn:hover:not(:disabled) { border-color: var(--purple); background: var(--purple-light); transform: translateY(-2px); }
        .option-btn.correct { background: #ecfdf5; color: #065f46; border-color: var(--success); }
        .option-btn.wrong { background: #fef2f2; color: #991b1b; border-color: var(--error); }
        [data-theme="dark"] .option-btn.correct { background: #064e3b; color: #6ee7b7; }
        [data-theme="dark"] .option-btn.wrong { background: #7f1d1d; color: #fca5a5; }
        .feedback-container { margin-top: 25px; min-height: 60px; }
        .feedback-status { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
        .explanation { font-size: 0.95rem; color: var(--text-muted); font-weight: 500; font-style: italic; padding: 14px 18px; background: var(--purple-light); border-left: 4px solid var(--purple); border-radius: 8px; }
        .next-btn { margin-top: 20px; padding: 16px; background: var(--purple); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 1.05rem; font-weight: 700; display: none; width: 100%; font-family: inherit; }
        .next-btn:hover { background: var(--purple-hover); }
        .back-btn { margin-top: 10px; padding: 14px; background: transparent; color: var(--purple); border: 2px solid var(--purple); border-radius: 14px; cursor: pointer; font-size: 0.95rem; font-weight: 700; width: 100%; font-family: inherit; }
        .score-screen { text-align: center; display: none; width: 100%; background: var(--card-bg); padding: 50px; border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
        .score-screen h2 { font-size: 2.2rem; color: var(--purple); margin-bottom: 20px; }
        .score-circle { width: 160px; height: 160px; border-radius: 50%; background: var(--purple-light); display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; font-size: 2.5rem; font-weight: 800; color: var(--purple); border: 8px solid var(--purple); }
        .score-message { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 30px; }
        .restart-btn { padding: 16px 32px; background: var(--purple); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 1rem; font-weight: 700; font-family: inherit; }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-weight: 600; }
        @media (max-width: 600px) { body { padding: 15px; } .quiz-main { padding: 25px; } .main-header h1 { font-size: 1.2rem; } .question { font-size: 1.1rem; } .option-btn { padding: 15px; } }
    </style>
</head>
<body>
<div class="app-container">
    <header class="main-header">
        <h1>TU170 Mids Quiz</h1>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>
    <div id="chapter-menu" class="chapter-menu"><div class="loading">Loading chapters...</div></div>
    <div class="quiz-main" id="quiz-main">
        <div class="top-bar"><div class="progress-text" id="progress-text">Question 1</div><div class="live-score" id="live-score">⭐ Score: 0</div></div>
        <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="question" id="question">Loading question...</div>
        <div class="options" id="options"></div>
        <div class="feedback-container"><div class="feedback-status" id="feedback-status"></div><div class="explanation" id="explanation" style="display: none;"></div></div>
        <button class="next-btn" id="next-btn">Next Question ➔</button>
        <button class="back-btn" onclick="goBackToMenu()">← Back to Chapters</button>
    </div>
    <div class="score-screen" id="score-screen">
        <h2>Quiz Completed!</h2>
        <div class="score-circle" id="score-circle">0%</div>
        <div class="score-message" id="score-message">You scored 0 out of 0</div>
        <button class="restart-btn" onclick="goBackToMenu()">Back to Chapters 🔄</button>
    </div>
</div>
<script>
    let allQuestions = []; let activeQuestions = []; let currentQuestionIndex = 0; let score = 0; let answered = false;
    const questionEl = document.getElementById('question'); const optionsEl = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn'); const progressText = document.getElementById('progress-text');
    const liveScoreEl = document.getElementById('live-score'); const feedbackStatus = document.getElementById('feedback-status');
    const explanationEl = document.getElementById('explanation'); const chapterMenu = document.getElementById('chapter-menu');
    const quizMain = document.getElementById('quiz-main'); const scoreScreen = document.getElementById('score-screen');
    const scoreCircle = document.getElementById('score-circle'); const scoreMessage = document.getElementById('score-message');
    const progressBarEl = document.getElementById('progress-bar');

    function toggleTheme() { const html = document.documentElement; const btn = document.getElementById('theme-toggle'); if (html.getAttribute('data-theme') === 'dark') { html.setAttribute('data-theme', 'light'); btn.textContent = '🌙'; localStorage.setItem('theme', 'light'); } else { html.setAttribute('data-theme', 'dark'); btn.textContent = '☀️'; localStorage.setItem('theme', 'dark'); } }
    if (localStorage.getItem('theme') === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.getElementById('theme-toggle').textContent = '☀️'; }

    async function loadData() {
        try {
            const response = await fetch('./data/tu170.JSON');
            if (!response.ok) throw new Error('Failed to load JSON');
            allQuestions = await response.json();
            const seen = new Set();
            allQuestions = allQuestions.filter(q => { const key = q.q.trim().toLowerCase(); if (seen.has(key)) return false; seen.add(key); return true; });
            buildChapterMenu();
        } catch (error) {
            chapterMenu.innerHTML = '<div class="loading" style="color: #ef4444;">⚠️ Error loading questions. Make sure data/tu170.JSON exists.</div>';
        }
    }

    function buildChapterMenu() {
        // Robust sorting for "Chapter 1", "Chapter 2", "Chapter 12" etc.
        const chapters = [...new Set(allQuestions.map(q => q.chapter))].sort((a, b) => 
            a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
        );
        
        chapterMenu.innerHTML = '';
        chapterMenu.innerHTML += `<button class="menu-btn" onclick="startQuiz('all')"><h2>📚 All Chapters</h2><p>${allQuestions.length} Questions</p></button>`;
        
        chapters.forEach(ch => { 
            const count = allQuestions.filter(q => q.chapter === ch).length; 
            // THE FIX IS HERE: Wrapping ${ch} in single quotes so it's treated as a string
            chapterMenu.innerHTML += `<button class="menu-btn" onclick="startQuiz('${ch}')"><h2>${ch}</h2><p>${count} Questions</p></button>`; 
        });
    }

    function startQuiz(chapter) {
        if (chapter === 'all') { activeQuestions = [...allQuestions]; } else { activeQuestions = allQuestions.filter(q => q.chapter === chapter); }
        activeQuestions.sort(() => Math.random() - 0.5);
        currentQuestionIndex = 0; score = 0;
        chapterMenu.style.display = 'none'; scoreScreen.style.display = 'none'; quizMain.style.display = 'flex';
        loadQuestion();
    }

    function goBackToMenu() { quizMain.style.display = 'none'; scoreScreen.style.display = 'none'; chapterMenu.style.display = 'grid'; }
    function updateTopBar() { liveScoreEl.textContent = `⭐ Score: ${score}`; const percent = (currentQuestionIndex / activeQuestions.length) * 100; progressBarEl.style.width = percent + '%'; }
    
    function loadQuestion() {
        answered = false; feedbackStatus.textContent = ''; explanationEl.style.display = 'none'; explanationEl.textContent = ''; nextBtn.style.display = 'none'; optionsEl.innerHTML = '';
        const q = activeQuestions[currentQuestionIndex];
        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${activeQuestions.length}`;
        updateTopBar(); questionEl.textContent = q.q;
        q.options.forEach((option, index) => { const btn = document.createElement('button'); btn.classList.add('option-btn'); btn.textContent = option; btn.onclick = () => selectOption(index); optionsEl.appendChild(btn); });
    }

    function selectOption(selectedIndex) {
        if (answered) return; answered = true;
        const q = activeQuestions[currentQuestionIndex]; const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, index) => { btn.disabled = true; if (index === q.answer) btn.classList.add('correct'); else if (index === selectedIndex) btn.classList.add('wrong'); });
        if (selectedIndex === q.answer) { score++; feedbackStatus.textContent = "✅ Correct!"; feedbackStatus.style.color = "var(--success)"; } else { feedbackStatus.textContent = `❌ Incorrect. The correct answer is: ${q.options[q.answer]}`; feedbackStatus.style.color = "var(--error)"; }
        explanationEl.textContent = `💡 Explanation: ${q.explanation || 'No explanation provided.'}`; explanationEl.style.display = 'block';
        updateTopBar(); nextBtn.style.display = 'block';
    }

    nextBtn.onclick = () => { currentQuestionIndex++; if (currentQuestionIndex < activeQuestions.length) loadQuestion(); else showScore(); };
    
    function showScore() {
        quizMain.style.display = 'none'; scoreScreen.style.display = 'block';
        const percent = Math.round((score / activeQuestions.length) * 100); scoreCircle.textContent = `${percent}%`;
        scoreMessage.textContent = `You scored ${score} out of ${activeQuestions.length}`;
        let msg = ""; if (percent >= 90) msg = "Outstanding! 🏆"; else if (percent >= 70) msg = "Great job! 👍"; else if (percent >= 50) msg = "Keep studying! 📚"; else msg = "Review and try again! 💪";
        scoreMessage.textContent += ` - ${msg}`;
    }

    loadData();
</script>
</body>
</html>
