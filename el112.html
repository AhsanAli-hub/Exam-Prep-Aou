<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL112 Quiz</title>
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --purple: #8b5cf6; --purple-hover: #7c3aed; --purple-light: #f5f3ff; --success: #10b981; --error: #ef4444; --bg: #f9fafb; --card-bg: #ffffff; --text-main: #111827; --text-muted: #6b7280; --border: #e5e7eb; --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05); --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1); --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        [data-theme="dark"] { --bg: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --text-muted: #94a3b8; --border: #334155; --purple-light: #312e81; }
        * { box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        .main-header { background: var(--card-bg); padding: 18px 30px; border-radius: 16px; box-shadow: var(--shadow-sm); text-align: center; position: relative; border: 1px solid var(--border); }
        .main-header h1 { margin: 0; color: var(--purple); font-size: 1.6rem; font-weight: 800; }
        .theme-toggle { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: var(--purple-light); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }

        .setup-screen { width: 100%; }
        .setup-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 30px; box-shadow: var(--shadow-md); }
        .setup-card h2 { margin: 0 0 6px 0; color: var(--purple); font-size: 1.5rem; font-weight: 800; }
        .setup-subtitle { margin: 0 0 20px 0; color: var(--text-muted); font-size: 0.95rem; font-weight: 500; }
        .setup-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
        .chip-btn { padding: 9px 16px; border-radius: 20px; border: 2px solid var(--purple); background: transparent; color: var(--purple); font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
        .chip-btn:hover { background: var(--purple-light); }
        .chapter-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .chapter-item { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border: 2px solid var(--border); border-radius: 14px; cursor: pointer; background: var(--card-bg); user-select: none; }
        .chapter-item:hover { border-color: var(--purple); transform: translateY(-2px); }
        .chapter-item.selected { border-color: var(--purple); background: var(--purple-light); }
        .chapter-checkbox { width: 20px; height: 20px; accent-color: var(--purple); cursor: pointer; flex-shrink: 0; }
        .chapter-info { display: flex; flex-direction: column; gap: 2px; }
        .chapter-name { font-weight: 700; font-size: 0.98rem; }
        .chapter-count { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
        .chapter-best { font-size: 0.78rem; color: var(--success); font-weight: 700; }

        .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 16px 18px; margin-top: 18px; border: 2px solid var(--border); border-radius: 14px; background: var(--card-bg); }
        .toggle-label { display: flex; flex-direction: column; gap: 2px; }
        .toggle-label strong { font-size: 0.95rem; }
        .toggle-label span { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
        .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .switch .slider { position: absolute; inset: 0; background: var(--border); border-radius: 28px; cursor: pointer; transition: 0.3s; }
        .switch .slider::before { content: ""; position: absolute; height: 22px; width: 22px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
        .switch input:checked + .slider { background: var(--purple); }
        .switch input:checked + .slider::before { transform: translateX(20px); }

        .setup-footer { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-top: 24px; flex-wrap: wrap; }
        .selected-count { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); }
        .start-btn { padding: 15px 32px; background: var(--purple); color: #fff; border: none; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit; }
        .start-btn:hover:not(:disabled) { background: var(--purple-hover); }
        .start-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .quiz-main { background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: var(--shadow-md); min-height: 500px; display: none; flex-direction: column; border: 1px solid var(--border); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; flex-wrap: wrap; }
        .top-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .progress-text { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .live-score { font-size: 0.95rem; font-weight: 800; color: var(--purple); background: var(--purple-light); padding: 6px 14px; border-radius: 20px; }
        .live-timer { font-size: 0.95rem; font-weight: 800; color: var(--text-muted); background: var(--border); padding: 6px 14px; border-radius: 20px; font-variant-numeric: tabular-nums; }
        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 30px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--purple), #a78bfa); width: 0%; transition: width 0.4s ease; }

        /* ---------- PASSAGE BOX ---------- */
        .passage-box {
            display: none;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--purple);
            border-radius: 12px;
            background: var(--purple-light);
            overflow: hidden;
        }
        .passage-box.show { display: block; }
        .passage-header {
            padding: 12px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            color: var(--purple);
            font-size: 0.95rem;
            user-select: none;
        }
        .passage-header .chev { transition: transform 0.2s; font-size: 0.85rem; }
        .passage-box.open .passage-header .chev { transform: rotate(90deg); }
        .passage-body {
            padding: 0 18px 18px 18px;
            font-size: 0.92rem;
            line-height: 1.7;
            color: var(--text-main);
            max-height: 340px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }
        .passage-box.open .passage-body { display: block; }
        [data-theme="dark"] .passage-box { background: var(--card-bg); }

        .question { font-size: 1.35rem; font-weight: 700; margin-bottom: 30px; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .show-answer-btn { margin-top: 14px; padding: 12px; background: transparent; color: var(--purple); border: 2px dashed var(--purple); border-radius: 14px; cursor: pointer; font-size: 0.95rem; font-weight: 700; font-family: inherit; width: 100%; }
        .show-answer-btn:hover:not(:disabled) { background: var(--purple-light); }
        .option-btn { padding: 18px 22px; border: 2px solid var(--border); border-radius: 14px; background: var(--card-bg); cursor: pointer; text-align: left; font-size: 1.05rem; font-weight: 500; color: var(--text-main); font-family: inherit; transition: all 0.2s; min-height: 55px; display: flex; align-items: center; gap: 12px; }
        .option-btn .key-hint { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); background: var(--border); border-radius: 6px; padding: 3px 8px; flex-shrink: 0; }
        .option-btn:hover:not(:disabled) { border-color: var(--purple); background: var(--purple-light); transform: translateY(-2px); }
        .option-btn.correct { background: #ecfdf5; color: #065f46; border-color: var(--success); }
        .option-btn.wrong { background: #fef2f2; color: #991b1b; border-color: var(--error); }
        [data-theme="dark"] .option-btn.correct { background: #064e3b; color: #6ee7b7; }
        [data-theme="dark"] .option-btn.wrong { background: #7f1d1d; color: #fca5a5; }
        .feedback-container { margin-top: 25px; min-height: 60px; }
        .feedback-status { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
        .explanation { font-size: 0.95rem; color: var(--text-muted); font-weight: 500; font-style: italic; padding: 14px 18px; background: var(--purple-light); border-left: 4px solid var(--purple); border-radius: 8px; }
        .next-btn { margin-top: 20px; padding: 16px; background: var(--purple); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 1.05rem; font-weight: 700; display: none; width: 100%; font-family: inherit; }
        .next-btn:hover { background: var(--purple-hover); }
        .back-btn { margin-top: 10px; padding: 14px; background: transparent; color: var(--purple); border: 2px solid var(--purple); border-radius: 14px; cursor: pointer; font-size: 0.95rem; font-weight: 700; width: 100%; font-family: inherit; }

        /* ---------- SCORE SCREEN ---------- */
        .score-screen { display: none; width: 100%; background: var(--card-bg); padding: 48px 40px; border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
        .score-header { text-align: center; font-size: 0.75rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 24px; }
        .score-percent { text-align: center; font-size: 4.5rem; font-weight: 800; color: var(--text-main); line-height: 1; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
        .score-caption { text-align: center; font-size: 0.95rem; color: var(--text-muted); font-weight: 500; margin-bottom: 36px; }

        .score-stats { display: flex; justify-content: center; gap: 1px; background: var(--border); border-radius: 14px; overflow: hidden; margin: 0 auto 36px; max-width: 480px; }
        .score-stat { flex: 1; background: var(--card-bg); padding: 20px 10px; text-align: center; }
        .score-stat-value { font-size: 1.6rem; font-weight: 800; line-height: 1; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
        .score-stat-value.good { color: var(--success); }
        .score-stat-value.bad { color: var(--error); }
        .score-stat-value.neutral { color: var(--text-main); }
        .score-stat-label { font-size: 0.68rem; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; }

        .score-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 36px; }
        .btn-primary, .btn-outline {
            padding: 14px 26px; border-radius: 12px; font-size: 0.92rem; font-weight: 700;
            font-family: inherit; cursor: pointer; transition: all 0.2s; min-width: 160px;
        }
        .btn-primary { background: var(--purple); color: #fff; border: none; }
        .btn-primary:hover { background: var(--purple-hover); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1.5px solid var(--border); }
        .btn-outline:hover { border-color: var(--purple); color: var(--purple); }

        .review-section { text-align: left; border-top: 1px solid var(--border); padding-top: 20px; }
        .review-section summary { cursor: pointer; font-weight: 700; color: var(--text-main); font-size: 0.92rem; padding: 10px 0; list-style: none; display: flex; align-items: center; justify-content: space-between; }
        .review-section summary::-webkit-details-marker { display: none; }
        .review-section summary::after { content: "▸"; font-size: 1rem; color: var(--text-muted); transition: transform 0.2s; }
        .review-section[open] summary::after { transform: rotate(90deg); }
        .review-section summary:hover { color: var(--purple); }
        .review-item { padding: 14px 0; margin-top: 8px; border-top: 1px solid var(--border); }
        .review-q { font-weight: 600; font-size: 0.95rem; margin-bottom: 10px; line-height: 1.5; }
        .review-line { font-size: 0.85rem; margin: 4px 0; font-weight: 500; }
        .review-line.user { color: var(--error); }
        .review-line.correct { color: var(--success); }
        .review-expl { font-size: 0.82rem; color: var(--text-muted); font-weight: 500; margin-top: 8px; line-height: 1.5; padding-left: 12px; border-left: 2px solid var(--border); }

        .loading { text-align: center; padding: 40px; color: var(--text-muted); font-weight: 600; }
        @media (max-width: 600px) { body { padding: 15px; } .quiz-main { padding: 25px; } .score-screen { padding: 30px 22px; } .score-percent { font-size: 3.4rem; } .main-header h1 { font-size: 1.2rem; } .question { font-size: 1.1rem; } .option-btn { padding: 15px; } .setup-card { padding: 22px; } .setup-footer { flex-direction: column; align-items: stretch; } .start-btn { width: 100%; } .top-bar { flex-direction: column; align-items: stretch; } .top-left { justify-content: center; } .btn-primary, .btn-outline { flex: 1; min-width: 0; } }
    </style>
</head>
<body>
<div class="app-container">
    <header class="main-header">
        <h1>EL112 Quiz</h1>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div id="setup-screen" class="setup-screen"><div class="loading">Loading chapters...</div></div>

    <div class="quiz-main" id="quiz-main">
        <div class="top-bar">
            <div class="top-left">
                <div class="progress-text" id="progress-text">Question 1</div>
                <div class="live-timer" id="live-timer">⏱ 00:00</div>
            </div>
            <div class="live-score" id="live-score">⭐ Score: 0</div>
        </div>
        <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>

        <!-- PASSAGE BOX (hidden unless current question has one) -->
        <div class="passage-box" id="passage-box">
            <div class="passage-header" id="passage-header">
                <span id="passage-title">Passage</span>
                <span class="chev">▸</span>
            </div>
            <div class="passage-body" id="passage-body"></div>
        </div>

        <div class="question" id="question">Loading question...</div>
        <div class="options" id="options"></div>
        <button class="show-answer-btn" id="show-answer-btn">💡 Show Answer</button>
        <div class="feedback-container"><div class="feedback-status" id="feedback-status"></div><div class="explanation" id="explanation" style="display: none;"></div></div>
        <button class="next-btn" id="next-btn">Next Question ➔</button>
        <button class="back-btn" onclick="goBackToMenu()">← Back to Chapters</button>
    </div>

    <div class="score-screen" id="score-screen">
        <div class="score-header">Quiz Complete</div>
        <div class="score-percent" id="score-percent">0%</div>
        <div class="score-caption" id="score-caption"></div>

        <div class="score-stats">
            <div class="score-stat">
                <div class="score-stat-value good" id="stat-correct">0</div>
                <div class="score-stat-label">Correct</div>
            </div>
            <div class="score-stat">
                <div class="score-stat-value bad" id="stat-wrong">0</div>
                <div class="score-stat-label">Incorrect</div>
            </div>
            <div class="score-stat">
                <div class="score-stat-value neutral" id="stat-time">00:00</div>
                <div class="score-stat-label">Time</div>
            </div>
        </div>

        <div class="score-actions">
            <button class="btn-primary" id="retry-wrong-btn" style="display: none;">Practice mistakes</button>
            <button class="btn-outline" onclick="goBackToMenu()">New quiz</button>
        </div>

        <details class="review-section" id="review-section" style="display: none;">
            <summary><span>Review incorrect answers (<span id="review-count">0</span>)</span></summary>
            <div id="review-list"></div>
        </details>
    </div>
</div>

<script>
    /* ====================== SUBJECT CONFIG ====================== */
    const SUBJECT = {
        key: 'el112',
        dataFile: './data/el112.json'
    };

    /* ====================== STATE ====================== */
    let allQuestions = [];
    let activeQuestions = [];
    let setupChapters = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let showAnswerEnabled = false;
    let wrongAnswers = [];
    let timerInterval = null;
    let elapsedSeconds = 0;
    let quizStartTime = 0;

    /* ====================== DOM ====================== */
    const questionEl     = document.getElementById('question');
    const showAnswerBtn  = document.getElementById('show-answer-btn');
    const optionsEl      = document.getElementById('options');
    const nextBtn        = document.getElementById('next-btn');
    const progressText   = document.getElementById('progress-text');
    const liveScoreEl    = document.getElementById('live-score');
    const liveTimerEl    = document.getElementById('live-timer');
    const feedbackStatus = document.getElementById('feedback-status');
    const explanationEl  = document.getElementById('explanation');
    const setupScreen    = document.getElementById('setup-screen');
    const quizMain       = document.getElementById('quiz-main');
    const scoreScreen    = document.getElementById('score-screen');
    const progressBarEl  = document.getElementById('progress-bar');
    const scorePercentEl = document.getElementById('score-percent');
    const scoreCaptionEl = document.getElementById('score-caption');
    const statCorrectEl  = document.getElementById('stat-correct');
    const statWrongEl    = document.getElementById('stat-wrong');
    const statTimeEl     = document.getElementById('stat-time');
    const retryWrongBtn  = document.getElementById('retry-wrong-btn');
    const reviewSection  = document.getElementById('review-section');
    const reviewList     = document.getElementById('review-list');
    const reviewCount    = document.getElementById('review-count');
    const passageBox     = document.getElementById('passage-box');
    const passageTitle   = document.getElementById('passage-title');
    const passageBody    = document.getElementById('passage-body');
    const passageHeader  = document.getElementById('passage-header');

    // Toggle passage open/closed when header is clicked
    passageHeader.addEventListener('click', () => {
        passageBox.classList.toggle('open');
    });

    /* ====================== THEME ====================== */
    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById('theme-toggle');
        if (html.getAttribute('data-theme') === 'dark') {
            html.setAttribute('data-theme', 'light'); btn.textContent = '🌙';
            try { localStorage.setItem('theme', 'light'); } catch (e) {}
        } else {
            html.setAttribute('data-theme', 'dark'); btn.textContent = '☀️';
            try { localStorage.setItem('theme', 'dark'); } catch (e) {}
        }
    }
    if (document.documentElement.getAttribute('data-theme') === 'dark') {
        document.getElementById('theme-toggle').textContent = '☀️';
    }

    /* ====================== HELPERS ====================== */
    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));
    }

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function formatTime(sec) {
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
    }

    /* ====================== HIGH SCORES ====================== */
    function loadHighScores() {
        try { return JSON.parse(localStorage.getItem(SUBJECT.key + '-highscores') || '{}'); }
        catch (e) { return {}; }
    }
    function saveHighScore(chapter, percent) {
        const scores = loadHighScores();
        if (scores[chapter] === undefined || percent > scores[chapter]) {
            scores[chapter] = percent;
            try { localStorage.setItem(SUBJECT.key + '-highscores', JSON.stringify(scores)); } catch (e) {}
        }
    }

    /* ====================== TIMER ====================== */
    function startTimer() {
        elapsedSeconds = 0;
        quizStartTime = Date.now();
        liveTimerEl.textContent = '⏱ 00:00';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            elapsedSeconds = Math.floor((Date.now() - quizStartTime) / 1000);
            liveTimerEl.textContent = '⏱ ' + formatTime(elapsedSeconds);
        }, 1000);
    }
    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    /* ====================== DATA LOADING ====================== */
    async function loadData() {
        try {
            const response = await fetch(SUBJECT.dataFile);
            if (!response.ok) throw new Error('Failed to load JSON');
            const raw = await response.json();

            // --- Normalize both shapes into one flat list ---
            let flat = [];

            if (Array.isArray(raw)) {
                // Old flat-array format
                flat = raw;
            } else {
                // New { passages, questions } format
                if (Array.isArray(raw.passages)) {
                    raw.passages.forEach(p => {
                        (p.questions || []).forEach(q => {
                            flat.push({
                                chapter: 'Reading',
                                passageTitle: p.title,
                                passageText: p.text,
                                q: q.q,
                                options: q.options,
                                answer: q.answer,
                                explanation: q.explanation
                            });
                        });
                    });
                }
                if (Array.isArray(raw.questions)) {
                    flat = flat.concat(raw.questions);
                }
            }

            // De-dupe by question text
            const seen = new Set();
            allQuestions = flat.filter(q => {
                const key = (q.q || '').trim().toLowerCase();
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            if (allQuestions.length === 0) throw new Error('No questions found');

            buildSetupScreen();
        } catch (error) {
            console.error(error);
            setupScreen.innerHTML = '<div class="loading" style="color:#ef4444;">⚠️ Error loading questions.<br><small>' + escapeHtml(error.message) + '</small><br><br>Make sure ' + SUBJECT.dataFile + ' exists and the page is served from a local server (not file://).</div>';
        }
    }

    /* ====================== SETUP SCREEN ====================== */
    function buildSetupScreen() {
        const chapterNames = [...new Set(allQuestions.map(q => q.chapter))]
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));

        setupChapters = chapterNames.map(name => ({
            name,
            count: allQuestions.filter(q => q.chapter === name).length
        }));

        const highScores = loadHighScores();

        const itemsHTML = setupChapters.map((ch, i) => {
            const best = highScores[ch.name];
            const bestHTML = best !== undefined ? `<span class="chapter-best">⭐ Best: ${best}%</span>` : '';
            return `
            <label class="chapter-item selected">
                <input type="checkbox" class="chapter-checkbox" data-index="${i}" checked>
                <span class="chapter-info">
                    <span class="chapter-name">${escapeHtml(ch.name)}</span>
                    <span class="chapter-count">${ch.count} question${ch.count === 1 ? '' : 's'}</span>
                    ${bestHTML}
                </span>
            </label>`;
        }).join('');

        setupScreen.innerHTML = `
            <div class="setup-card">
                <h2>Choose Your Chapters</h2>
                <p class="setup-subtitle">Tick the chapters you want to practise, then press Start.</p>
                <div class="setup-controls">
                    <button type="button" class="chip-btn" id="select-all-btn">✓ Select All</button>
                    <button type="button" class="chip-btn" id="clear-all-btn">✕ Clear All</button>
                </div>
                <div class="chapter-list">${itemsHTML}</div>

                <div class="toggle-row">
                    <div class="toggle-label">
                        <strong>💡 Show Answer button</strong>
                        <span>Adds a hint button under each question (no point awarded).</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="answer-toggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setup-footer">
                    <div class="selected-count" id="selected-count"></div>
                    <button type="button" class="start-btn" id="start-btn">Start Quiz ➔</button>
                </div>
            </div>`;

        updateSelectedCount();
    }

    setupScreen.addEventListener('change', (e) => {
        if (!e.target.classList.contains('chapter-checkbox')) return;
        e.target.closest('.chapter-item').classList.toggle('selected', e.target.checked);
        updateSelectedCount();
    });

    setupScreen.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.id === 'select-all-btn') setAllChecked(true);
        else if (btn.id === 'clear-all-btn') setAllChecked(false);
        else if (btn.id === 'start-btn') startQuiz();
    });

    function setAllChecked(state) {
        setupScreen.querySelectorAll('.chapter-checkbox').forEach(cb => {
            cb.checked = state;
            cb.closest('.chapter-item').classList.toggle('selected', state);
        });
        updateSelectedCount();
    }

    function updateSelectedCount() {
        const checked = [...setupScreen.querySelectorAll('.chapter-checkbox:checked')];
        const totalQuestions = checked.reduce(
            (sum, cb) => sum + setupChapters[Number(cb.dataset.index)].count, 0
        );

        const countEl = document.getElementById('selected-count');
        const startBtn = document.getElementById('start-btn');
        if (!countEl || !startBtn) return;

        if (checked.length === 0) {
            countEl.textContent = 'Select at least one chapter';
        } else {
            countEl.textContent =
                `${checked.length} chapter${checked.length === 1 ? '' : 's'} · ${totalQuestions} question${totalQuestions === 1 ? '' : 's'}`;
        }
        startBtn.disabled = checked.length === 0;
    }

    /* ====================== QUIZ FLOW ====================== */
    function startQuiz() {
        const checked = [...setupScreen.querySelectorAll('.chapter-checkbox:checked')];
        if (checked.length === 0) return;

        const chosen = new Set(checked.map(cb => setupChapters[Number(cb.dataset.index)].name));
        activeQuestions = shuffle(allQuestions.filter(q => chosen.has(q.chapter)));

        showAnswerEnabled = document.getElementById('answer-toggle').checked;

        currentQuestionIndex = 0;
        score = 0;
        wrongAnswers = [];

        setupScreen.style.display = 'none';
        scoreScreen.style.display = 'none';
        quizMain.style.display = 'flex';

        startTimer();
        loadQuestion();
    }

    function goBackToMenu() {
        stopTimer();
        quizMain.style.display = 'none';
        scoreScreen.style.display = 'none';
        setupScreen.style.display = 'block';
        buildSetupScreen();
    }

    function updateTopBar() {
        liveScoreEl.textContent = `⭐ Score: ${score}`;
        const percent = (currentQuestionIndex / activeQuestions.length) * 100;
        progressBarEl.style.width = percent + '%';
    }

    // Track which passage is currently shown so we only reset scroll when it changes
    let lastShownPassageTitle = null;

    function loadQuestion() {
        answered = false;
        feedbackStatus.textContent = '';
        explanationEl.style.display = 'none';
        explanationEl.textContent = '';
        nextBtn.style.display = 'none';
        optionsEl.innerHTML = '';

        showAnswerBtn.style.display = showAnswerEnabled ? 'block' : 'none';
        showAnswerBtn.disabled = false;
        showAnswerBtn.onclick = revealAnswer;

        const q = activeQuestions[currentQuestionIndex];

        // ---- Passage handling ----
        if (q.passageText) {
            passageBox.classList.add('show');
            passageTitle.textContent = q.passageTitle || 'Passage';
            passageBody.textContent = q.passageText;

            // Only auto-open and reset scroll if the passage changed
            if (lastShownPassageTitle !== q.passageTitle) {
                passageBox.classList.add('open');
                passageBody.scrollTop = 0;
                lastShownPassageTitle = q.passageTitle;
            }
        } else {
            passageBox.classList.remove('show', 'open');
            lastShownPassageTitle = null;
        }

        // Shuffle options and remember the new correct index
        const pairs = q.options.map((text, i) => ({ text, isCorrect: i === q.answer }));
        shuffle(pairs);
        q._shuffledOptions = pairs.map(p => p.text);
        q._shuffledAnswer = pairs.findIndex(p => p.isCorrect);

        progressText.textContent = `Q${currentQuestionIndex + 1} / ${activeQuestions.length}`;
        updateTopBar();
        questionEl.textContent = q.q;

        q._shuffledOptions.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            const keyHint = document.createElement('span');
            keyHint.classList.add('key-hint');
            keyHint.textContent = index + 1;
            const textSpan = document.createElement('span');
            textSpan.textContent = option;
            btn.appendChild(keyHint);
            btn.appendChild(textSpan);
            btn.onclick = () => selectOption(index);
            optionsEl.appendChild(btn);
        });
    }

    function selectOption(selectedIndex) {
        if (answered) return;
        showAnswerBtn.style.display = 'none';
        answered = true;

        const q = activeQuestions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const correctIdx = q._shuffledAnswer;

        buttons.forEach((btn, index) => {
            btn.disabled = true;
            if (index === correctIdx) btn.classList.add('correct');
            else if (index === selectedIndex) btn.classList.add('wrong');
        });

        if (selectedIndex === correctIdx) {
            score++;
            feedbackStatus.textContent = "✅ Correct!";
            feedbackStatus.style.color = "var(--success)";
        } else {
            feedbackStatus.textContent = `❌ Incorrect. The correct answer is: ${q._shuffledOptions[correctIdx]}`;
            feedbackStatus.style.color = "var(--error)";
            wrongAnswers.push({
                q: q.q,
                userAnswer: q._shuffledOptions[selectedIndex],
                correctAnswer: q._shuffledOptions[correctIdx],
                explanation: q.explanation
            });
        }

        explanationEl.textContent = `💡 Explanation: ${q.explanation || 'No explanation provided.'}`;
        explanationEl.style.display = 'block';
        updateTopBar();
        nextBtn.style.display = 'block';
    }

    function revealAnswer() {
        if (answered) return;
        answered = true;

        const q = activeQuestions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        const correctIdx = q._shuffledAnswer;

        buttons.forEach((btn, index) => {
            btn.disabled = true;
            if (index === correctIdx) btn.classList.add('correct');
        });

        feedbackStatus.textContent = `💡 The correct answer is: ${q._shuffledOptions[correctIdx]}`;
        feedbackStatus.style.color = "var(--purple)";
        explanationEl.textContent = `💡 Explanation: ${q.explanation || 'No explanation provided.'}`;
        explanationEl.style.display = 'block';

        showAnswerBtn.style.display = 'none';
        nextBtn.style.display = 'block';
        updateTopBar();
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < activeQuestions.length) loadQuestion();
        else showScore();
    };

    /* ====================== KEYBOARD SHORTCUTS ====================== */
    document.addEventListener('keydown', (e) => {
        if (quizMain.style.display === 'none') return;

        if (!answered && ['1', '2', '3', '4'].includes(e.key)) {
            const idx = Number(e.key) - 1;
            const buttons = document.querySelectorAll('.option-btn');
            if (idx < buttons.length && !buttons[idx].disabled) {
                buttons[idx].click();
            }
            return;
        }

        if (answered && (e.key === 'Enter' || e.key === ' ')) {
            e.preventDefault();
            nextBtn.click();
        }
    });

    /* ====================== SCORE SCREEN ====================== */
    function showScore() {
        stopTimer();
        quizMain.style.display = 'none';
        scoreScreen.style.display = 'block';

        const total = activeQuestions.length;
        const correct = score;
        const wrong = total - correct;
        const percent = Math.round((correct / total) * 100);

        scorePercentEl.textContent = `${percent}%`;
        statCorrectEl.textContent = correct;
        statWrongEl.textContent = wrong;
        statTimeEl.textContent = formatTime(elapsedSeconds);

        let caption = "";
        if (percent >= 90) caption = "Excellent result";
        else if (percent >= 70) caption = "Solid work";
        else if (percent >= 50) caption = "Room to improve";
        else caption = "Needs more practice";
        scoreCaptionEl.textContent = caption;

        const usedChapters = [...new Set(activeQuestions.map(q => q.chapter))];
        usedChapters.forEach(ch => saveHighScore(ch, percent));

        if (wrongAnswers.length > 0) {
            retryWrongBtn.style.display = 'inline-block';
            retryWrongBtn.onclick = retryWrongAnswers;
        } else {
            retryWrongBtn.style.display = 'none';
        }

        if (wrongAnswers.length > 0) {
            reviewSection.style.display = 'block';
            reviewSection.open = false;
            reviewCount.textContent = wrongAnswers.length;
            reviewList.innerHTML = wrongAnswers.map(w => `
                <div class="review-item">
                    <div class="review-q">${escapeHtml(w.q)}</div>
                    <div class="review-line user">Your answer: ${escapeHtml(w.userAnswer)}</div>
                    <div class="review-line correct">Correct answer: ${escapeHtml(w.correctAnswer)}</div>
                    <div class="review-expl">${escapeHtml(w.explanation || 'No explanation provided.')}</div>
                </div>
            `).join('');
        } else {
            reviewSection.style.display = 'none';
        }
    }

    function retryWrongAnswers() {
        const wrongTextSet = new Set(wrongAnswers.map(w => w.q));
        activeQuestions = shuffle(allQuestions.filter(q => wrongTextSet.has(q.q)));

        wrongAnswers = [];
        currentQuestionIndex = 0;
        score = 0;

        scoreScreen.style.display = 'none';
        quizMain.style.display = 'flex';

        startTimer();
        loadQuestion();
    }

    /* ====================== INIT ====================== */
    loadData();
</script>
</body>
</html>
