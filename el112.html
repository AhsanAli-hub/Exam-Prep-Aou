<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL112 Mids Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #8b5cf6;
            --purple-hover: #7c3aed;
            --purple-light: #f5f3ff;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9;
            --text-muted: #94a3b8; --border: #334155; --purple-light: #312e81;
        }
        * { box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        
        .main-header { background: var(--card-bg); padding: 18px 30px; border-radius: 16px; box-shadow: var(--shadow-sm); text-align: center; position: relative; border: 1px solid var(--border); }
        .main-header h1 { margin: 0; color: var(--purple); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .theme-toggle { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: var(--purple-light); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
        .theme-toggle:hover { transform: translateY(-50%) scale(1.1); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; }
        .progress-text { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .live-score { font-size: 0.95rem; font-weight: 800; color: var(--purple); background: var(--purple-light); padding: 6px 14px; border-radius: 20px; white-space: nowrap; }

        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 30px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--purple), #a78bfa); width: 0%; transition: width 0.4s ease; border-radius: 4px; }

        .quiz-main { background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: var(--shadow-md); min-height: 500px; display: flex; flex-direction: column; border: 1px solid var(--border); }

        .question { font-size: 1.35rem; font-weight: 700; margin-bottom: 30px; line-height: 1.5; color: var(--text-main); }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { padding: 18px 22px; border: 2px solid var(--border); border-radius: 14px; background: var(--card-bg); cursor: pointer; text-align: left; font-size: 1.05rem; font-weight: 500; color: var(--text-main); font-family: inherit; transition: all 0.2s ease; display: flex; align-items: center; min-height: 55px; }
        .option-btn:hover:not(:disabled) { border-color: var(--purple); background: var(--purple-light); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .option-btn.correct { background: #ecfdf5; color: #065f46; border-color: var(--success); animation: pulse 0.4s ease; }
        .option-btn.wrong { background: #fef2f2; color: #991b1b; border-color: var(--error); }
        [data-theme="dark"] .option-btn.correct { background: #064e3b; color: #6ee7b7; }
        [data-theme="dark"] .option-btn.wrong { background: #7f1d1d; color: #fca5a5; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        .feedback-container { margin-top: 25px; min-height: 60px; }
        .feedback-status { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
        .explanation { font-size: 0.95rem; color: var(--text-muted); font-weight: 500; font-style: italic; padding: 14px 18px; background: var(--purple-light); border-left: 4px solid var(--purple); border-radius: 8px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .next-btn { margin-top: 20px; padding: 16px; background: var(--purple); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 1.05rem; font-weight: 700; transition: all 0.2s; display: none; width: 100%; font-family: inherit; letter-spacing: 0.3px; }
        .next-btn:hover { background: var(--purple-hover); transform: translateY(-2px); box-shadow: var(--shadow-lg); }

        .score-screen { text-align: center; display: none; width: 100%; background: var(--card-bg); padding: 50px; border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
        .score-screen h2 { font-size: 2.2rem; color: var(--purple); margin-bottom: 20px; }
        .score-circle { width: 160px; height: 160px; border-radius: 50%; background: var(--purple-light); display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; font-size: 2.5rem; font-weight: 800; color: var(--purple); border: 8px solid var(--purple); }
        .score-message { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 30px; }
        .restart-btn { padding: 16px 32px; background: var(--purple); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 1rem; font-weight: 700; transition: all 0.2s; font-family: inherit; }
        .restart-btn:hover { background: var(--purple-hover); transform: translateY(-2px); box-shadow: var(--shadow-lg); }

        @media (max-width: 600px) { 
            body { padding: 15px; }
            .quiz-main { padding: 25px; } 
            .main-header h1 { font-size: 1.2rem; } 
            .question { font-size: 1.1rem; } 
            .theme-toggle { width: 34px; height: 34px; font-size: 0.9rem; right: 12px; }
            .option-btn { padding: 15px; font-size: 1rem; }
            .live-score { font-size: 0.85rem; padding: 5px 10px; }
        }
    </style>
</head>

</div>

        { q: "People learn languages a lot faster if they use it.", options: ["TRUE", "FALSE"], answer: 0, explanation: "The text states if people learn a language because they need to use it professionally, they often learn it faster." },

        { q: "What does the author mean by 'dry-labbing'?", options: ["Obtaining, using or altering unauthorized experimental data", "Using quotations without proper documentation", "Failing to collect lab data", "Making sure that the lab is dry"], answer: 0, explanation: "The text defines dry-labbing as obtaining and using experimental data from others without consent, or fabricating data." },
        { q: "Altering facts to get exemptions or extensions is considered as an act of plagiarism.", options: ["TRUE", "FALSE"], answer: 1, explanation: "The text lists misrepresenting the facts to get exemptions as a form of Cheating, not Plagiarism." },

        { q: "What does the word 'it' in paragraph 3 mean? ('...you can call up teammates and head to the gym to discuss it and play it out.')", options: ["Play", "Teammates", "Gym", "Stress"], answer: 3, explanation: "The pronoun 'it' refers back to the stress mentioned in the previous sentence." },
        { q: "The first white men to visit Samoa found men who:", options: ["Were not entirely blind", "Described things by touching them", "Could see with their elbows", "Could see when they held hands"], answer: 1, explanation: "The text states they found blind men who could describe things in detail just by holding their hands over objects." },
        { q: "What is the main idea of the first paragraph of the Samoa passage?", options: ["Very few people have the sensitivity of the blind", "Blind people can manage to see things, but only vaguely", "The eyes are not the only way of seeing", "It is possible to localize the photosensitive areas of the body"], answer: 2, explanation: "The paragraph provides multiple historical examples of blind individuals 'seeing' via other body parts, supporting the idea that eyes aren't the only way." },
                { q: "My granny ________ my little sister for the past two days.", options: ["has looked after", "looks after", "has been looking after", "has been looked after"], answer: 2, explanation: "The present perfect continuous ('has been looking after') is used for actions that started in the past and are still continuing." },
        { q: "I am busy right now. I________ breakfast.", options: ["have", "am having", "having", "am have"], answer: 1, explanation: "The present continuous ('am having') is used for actions happening right now." },
        { q: "John always has a positive ________ and looks for solutions for every problem.", options: ["Attitude", "Behavior", "Etiquette", "Practices"], answer: 0, explanation: "Having a positive 'attitude' means having a positive mindset towards situations." },
        { q: "The team's successful completion was a result of seamless ________", options: ["collaboration", "education", "elaboration", "celebration"], answer: 0, explanation: "Seamless 'collaboration' means working together smoothly without interruption." },
        { q: "I've been feeling ill since I woke up this morning. What is the mistake?", options: ["No subject-verb agreement", "The sentence is correct", "Incorrect tense", "Wrong word order"], answer: 1, explanation: "The sentence is grammatically correct, using present perfect continuous with 'since' + past simple." },
        { q: "I ________ out of the shower when there was a knock at the door.", options: ["Just stepped", "Just stepping", "Have just stepped", "Was just stepping"], answer: 3, explanation: "The past continuous ('was just stepping') describes an ongoing action interrupted by another past event." },
        { q: "I am learning French but I haven't been ________ for long.", options: ["learn", "learning", "learned", "learns"], answer: 1, explanation: "The present perfect continuous requires the '-ing' form of the verb after 'been'." },
        { q: "The hotel was full, so I was glad that ________ in advance.", options: ["We booked", "We've booked", "We booking", "We had booked"], answer: 3, explanation: "The past perfect ('had booked') is used for an action completed before another past action (the hotel being full)." },
        { q: "After they ________ the shellfish, they began to feel sick.", options: ["Have eaten", "Ate", "Eat", "Had eaten"], answer: 3, explanation: "The past perfect ('had eaten') shows the first completed action in the past before the second action began." },
        { q: "Despite being an introvert, Sarah recognizes the importance of ________ and has actively joined professional groups to build connections.", options: ["Outfit", "Potential", "Mingle", "Networking"], answer: 3, explanation: "Networking is the action of interacting with others to exchange information and develop professional contacts." },
        { q: "I called his office but he ________ already left.", options: ["Had had", "Had", "Have", "Has"], answer: 1, explanation: "The past perfect ('had left') is formed with 'had' + past participle." },
        { q: "I have written this email but I have not sent it ________", options: ["Yet", "Just", "Already", "For"], answer: 0, explanation: "'Yet' is used in negative present perfect sentences to indicate something hasn't happened up to now." },

        { q: "They ________ each other since last year.", options: ["Known", "Have known", "Knew", "Has known"], answer: 1, explanation: "State verbs like 'know' use the present perfect ('have known') with 'since' to show a state continuing from the past." },
        { q: "John was stopped by the police on the way home. He ________ too fast.", options: ["Drove", "Has been driving", "Had been driving", "Driving"], answer: 2, explanation: "The past perfect continuous ('had been driving') describes an ongoing action leading up to a past event." },
        { q: "Sally is still here. She hasn't ________ yet.", options: ["Went", "Going", "Gone", "Go"], answer: 2, explanation: "The present perfect negative requires 'hasn't' + past participle ('gone')." },

    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById('theme-toggle');
        if (html.getAttribute('data-theme') === 'dark') {
            html.setAttribute('data-theme', 'light');
            btn.textContent = '🌙';
            localStorage.setItem('theme', 'light');
        } else {
            html.setAttribute('data-theme', 'dark');
            btn.textContent = '☀️';
            localStorage.setItem('theme', 'dark');
        }
    }
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-toggle').textContent = '☀️';
    }

    const seenQuestionText = new Set();
    questions = questions.filter((question) => {
        const normalizedQuestion = question.q.trim().toLowerCase();
        if (seenQuestionText.has(normalizedQuestion)) return false;
        seenQuestionText.add(normalizedQuestion);
        return true;
    });

    questions.sort(() => Math.random() - 0.5);
    let currentQuestionIndex = 0; let score = 0; let answered = false;

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn');
    const progressText = document.getElementById('progress-text');
    const liveScoreEl = document.getElementById('live-score');
    const feedbackStatus = document.getElementById('feedback-status');
    const explanationEl = document.getElementById('explanation');
    const quizMain = document.getElementById('quiz-main');
    const scoreScreen = document.getElementById('score-screen');
    const scoreCircle = document.getElementById('score-circle');
    const scoreMessage = document.getElementById('score-message');
    const progressBarEl = document.getElementById('progress-bar');

    function updateTopBar() {
        liveScoreEl.textContent = `⭐ Score: ${score}`;
        const progressPercent = (currentQuestionIndex / questions.length) * 100;
        progressBarEl.style.width = progressPercent + '%';
    }

    function loadQuestion() {
        answered = false;
        feedbackStatus.textContent = '';
        explanationEl.style.display = 'none';
        explanationEl.textContent = '';
        nextBtn.style.display = 'none';
        optionsEl.innerHTML = '';

        const currentQuestion = questions[currentQuestionIndex];
        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        updateTopBar();

        questionEl.textContent = currentQuestion.q;

        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.classList.add('option-btn');
            button.textContent = option;
            button.onclick = () => selectOption(index);
            optionsEl.appendChild(button);
        });
    }

    function selectOption(selectedIndex) {
        if (answered) return;
        answered = true;

        const currentQuestion = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        
        buttons.forEach((button, index) => {
            button.disabled = true;
            if (index === currentQuestion.answer) button.classList.add('correct');
            else if (index === selectedIndex) button.classList.add('wrong');
        });

        if (selectedIndex === currentQuestion.answer) {
            score++;
            feedbackStatus.textContent = "✅ Correct!";
            feedbackStatus.style.color = "var(--success)";
        } else {
            feedbackStatus.textContent = `❌ Incorrect. The correct answer is: ${currentQuestion.options[currentQuestion.answer]}`;
            feedbackStatus.style.color = "var(--error)";
        }

        if (currentQuestion.explanation) {
            explanationEl.textContent = `💡 Explanation: ${currentQuestion.explanation}`;
            explanationEl.style.display = 'block';
        } else {
            explanationEl.textContent = `💡 Explanation: No explanation provided.`;
            explanationEl.style.display = 'block';
        }

        updateTopBar();
        nextBtn.style.display = 'block';
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) loadQuestion();
        else showScore();
    };

    function showScore() {
        quizMain.style.display = 'none';
        scoreScreen.style.display = 'block';
        const percentage = Math.round((score / questions.length) * 100);
        scoreCircle.textContent = `${percentage}%`;
        scoreMessage.textContent = `You scored ${score} out of ${questions.length}`;
        let msg = "";
        if (percentage >= 90) msg = "Outstanding! You are ready for the exam! 🏆";
        else if (percentage >= 70) msg = "Great job! Just a little more review needed. 👍";
        else if (percentage >= 50) msg = "Good effort, but keep studying! 📚";
        else msg = "Don't worry, review the lectures and try again! 💪";
        scoreMessage.textContent += ` - ${msg}`;
    }

    loadQuestion();
