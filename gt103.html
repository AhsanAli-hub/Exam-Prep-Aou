<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT103 Mids Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #8b5cf6;
            --purple-hover: #7c3aed;
            --purple-light: #f5f3ff;
            --success: #10b981;
            --error: #ef4444;
            --bg: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9;
            --text-muted: #94a3b8; --border: #334155; --purple-light: #312e81;
        }
        * { box-sizing: border-box; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        
        .main-header { background: var(--card-bg); padding: 18px 30px; border-radius: 16px; box-shadow: var(--shadow-sm); text-align: center; position: relative; border: 1px solid var(--border); }
        .main-header h1 { margin: 0; color: var(--purple); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .theme-toggle { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: var(--purple-light); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
        .theme-toggle:hover { transform: translateY(-50%) scale(1.1); }

        /* Top Bar with Progress + Score */
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
            gap: 15px; 
        }
        .progress-text { font-size: 0.85rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .live-score { 
            font-size: 0.95rem; 
            font-weight: 800; 
            color: var(--purple); 
            background: var(--purple-light); 
            padding: 6px 14px; 
            border-radius: 20px; 
            white-space: nowrap;
        }

        .progress-bar-container { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 30px; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--purple), #a78bfa); width: 0%; transition: width 0.4s ease; border-radius: 4px; }

        .quiz-main { background: var(--card-bg); padding: 40px; border-radius: 20px; box-shadow: var(--shadow-md); min-height: 500px; display: flex; flex-direction: column; border: 1px solid var(--border); }

        .question { font-size: 1.35rem; font-weight: 700; margin-bottom: 30px; line-height: 1.5; color: var(--text-main); }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { padding: 18px 22px; border: 2px solid var(--border); border-radius: 14px; background: var(--card-bg); cursor: pointer; text-align: left; font-size: 1.05rem; font-weight: 500; color: var(--text-main); font-family: inherit; transition: all 0.2s ease; display: flex; align-items: center; min-height: 55px; }
        .option-btn:hover:not(:disabled) { border-color: var(--purple); background: var(--purple-light); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .option-btn.correct { background: #ecfdf5; color: #065f46; border-color: var(--success); animation: pulse 0.4s ease; }
        .option-btn.wrong { background: #fef2f2; color: #991b1b; border-color: var(--error); }
        [data-theme="dark"] .option-btn.correct { background: #064e3b; color: #6ee7b7; }
        [data-theme="dark"] .option-btn.wrong { background: #7f1d1d; color: #fca5a5; }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.9; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

        .feedback-container { margin-top: 25px; min-height: 60px; }
        .feedback-status { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
        .explanation { font-size: 0.95rem; color: var(--text-muted); font-weight: 500; font-style: italic; padding: 14px 18px; background: var(--purple-light); border-left: 4px solid var(--purple); border-radius: 8px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .next-btn { margin-top: 20px; padding: 16px; background: var(--purple); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 1.05rem; font-weight: 700; transition: all 0.2s; display: none; width: 100%; font-family: inherit; letter-spacing: 0.3px; }
        .next-btn:hover { background: var(--purple-hover); transform: translateY(-2px); box-shadow: var(--shadow-lg); }

        .score-screen { text-align: center; display: none; width: 100%; background: var(--card-bg); padding: 50px; border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
        .score-screen h2 { font-size: 2.2rem; color: var(--purple); margin-bottom: 20px; }
        .score-circle { width: 160px; height: 160px; border-radius: 50%; background: var(--purple-light); display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; font-size: 2.5rem; font-weight: 800; color: var(--purple); border: 8px solid var(--purple); }
        .score-message { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 30px; }
        .restart-btn { padding: 16px 32px; background: var(--purple); color: white; border: none; border-radius: 14px; cursor: pointer; font-size: 1rem; font-weight: 700; transition: all 0.2s; font-family: inherit; }
        .restart-btn:hover { background: var(--purple-hover); transform: translateY(-2px); box-shadow: var(--shadow-lg); }

        @media (max-width: 600px) { 
            body { padding: 15px; }
            .quiz-main { padding: 25px; } 
            .main-header h1 { font-size: 1.2rem; } 
            .question { font-size: 1.1rem; } 
            .theme-toggle { width: 34px; height: 34px; font-size: 0.9rem; right: 12px; }
            .option-btn { padding: 15px; font-size: 1rem; }
            .live-score { font-size: 0.85rem; padding: 5px 10px; }
        }
    </style>
</head>
<body>
<div class="app-container" id="app-container">
    <header class="main-header">
        <h1>GT103 Mids Quiz</h1>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </header>

    <div class="quiz-main" id="quiz-main">
        <div class="top-bar">
            <div class="progress-text" id="progress-text">Question 1</div>
            <div class="live-score" id="live-score">⭐ Score: 0</div>
        </div>
        <div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div>

        <div class="question" id="question">Loading question...</div>
        <div class="options" id="options"></div>

        <div class="feedback-container">
            <div class="feedback-status" id="feedback-status"></div>
            <div class="explanation" id="explanation" style="display: none;"></div>
        </div>

        <button class="next-btn" id="next-btn">Next Question ➔</button>
    </div>

    <div class="score-screen" id="score-screen">
        <h2>Quiz Completed!</h2>
        <div class="score-circle" id="score-circle">0%</div>
        <div class="score-message" id="score-message">You scored 0 out of 0</div>
        <button class="restart-btn" onclick="location.reload()">Retake Quiz 🔄</button>
    </div>
</div>

<script>

    let questions = [

        { q: "Artificial Intelligence was defined by John McCarthy as...", options: ["The study of making computers do things which people are better at", "The science and engineering of making intelligent machines", "Getting computers to do tasks which require human intelligence"], answer: 1, explanation: "John McCarthy defined AI as the science and engineering of making intelligent machines." },
        { q: "Narrow AI (Weak AI) refers to...", options: ["AI that can replicate human intelligence completely", "AI research that aims to apply partial human intelligence in specific problem solving", "AI that can perform any intellectual task a human can do"], answer: 1, explanation: "Narrow AI is designed for specific tasks, unlike General AI which can do any intellectual task." },
        { q: "Which of the following is the correct example of Narrow AI?", options: ["A robot that writes essays and engages in conversation", "Science fiction AI like C-3PO", "Siri converts speech to text and matches responses from a database"], answer: 2, explanation: "Siri is a classic example of Narrow AI because it performs specific tasks like speech recognition." },
        { q: "General AI (Strong AI) is described as AI that...", options: ["Applies partial human intelligence in specific domains", "Can perform any intellectual task a human can do, with abilities to learn, reason, adapt, and solve problems across diverse domains", "Aims to replicate human intelligence completely"], answer: 1, explanation: "General AI (AGI) possesses human-level intelligence across a wide variety of tasks." },
        { q: "The Turing Test was proposed by Alan Turing in...", options: ["1943", "1956", "1950"], answer: 2, explanation: "Alan Turing proposed the Turing Test in 1950 in his paper Computing Machinery and Intelligence." },
        { q: "What is the purpose of the Turing Test?", options: ["To measure a computer's processing speed", "To determine if a machine's responses are indistinguishable from those of a human during a text-based conversation", "To test if a robot can physically behave like a human"], answer: 1, explanation: "The test checks if a machine's responses are indistinguishable from a human's during a text conversation." },
        { q: "One limitation of the Turing Test mentioned in the lecture is...", options: ["It requires physical robots to participate", "Passing the test does not imply true understanding - chatbots simulate intelligence but lack awareness", "It can only be conducted in English"], answer: 1, explanation: "Passing the test does not imply true understanding or consciousness, only simulated intelligence." },
        { q: "Which of the following is a key technique used in Symbolic AI?", options: ["Supervised Learning", "Reinforcement Learning", "Logical Inference"], answer: 2, explanation: "Symbolic AI uses symbols and rules, relying heavily on logical inference to simulate reasoning." },
        { q: "Machine Learning is described in the lecture as...", options: ["Systems that use symbols and rules to simulate human reasoning", "Intelligence that emerges from patterns learned from data rather than predefined rules", "AI that replicates human intelligence completely"], answer: 1, explanation: "ML is a subset of AI that allows systems to learn patterns from data rather than relying on predefined rules." },
        { q: "A weakness of Machine Learning mentioned in the lecture is that it often acts as a 'black box,' lacking transparency.", options: ["TRUE", "FALSE"], answer: 0, explanation: "ML models often act as black boxes because their internal decision-making processes lack transparency." },
        { q: "TPUs (Tensor Processing Units) were developed by which company?", options: ["Microsoft", "NVIDIA", "Google"], answer: 2, explanation: "Google developed Tensor Processing Units (TPUs) specifically to accelerate AI computations." },
        { q: "Which of the following is NOT listed as a Cloud AI example in the lecture?", options: ["Microsoft Azure AI", "NVIDIA CUDA", "Amazon Web Services (AWS)"], answer: 1, explanation: "NVIDIA CUDA is a hardware/software platform, not a cloud-based AI service like Azure or AWS." },
        { q: "In the Short History of AI, the 1956 Dartmouth meeting is significant because...", options: ["It marked the first time AI beat a human in chess", "The term 'Artificial Intelligence' was officially adopted", "The first neural network was created"], answer: 1, explanation: "The 1956 Dartmouth Workshop is considered the birth of AI, where the term was officially adopted." },
        { q: "The period 1970-1989 in AI history is characterized by...", options: ["Statistical approaches and resurgence of probability", "Knowledge-based approaches, including the expert systems boom and AI Winter", "Early AI programs like Samuel's checkers program"], answer: 1, explanation: "This era saw the rise of expert systems followed by an AI Winter due to unmet expectations." },
        { q: "In 1943, McCulloch & Pitts contributed to AI history by developing...", options: ["The Logic Theorist program", "The Boolean circuit model of the brain", "The first expert system"], answer: 1, explanation: "McCulloch and Pitts developed the first mathematical model of a neural network based on Boolean circuits." },
        { q: "An intelligent agent in AI is defined as an entity that...", options: ["Can only process text-based data", "Perceives its environment through sensors, makes decisions, and acts to achieve specific goals using actuators", "Works exclusively in fully observable environments"], answer: 1, explanation: "An agent uses sensors to perceive its environment and actuators to act upon it to achieve goals." },
        { q: "In an intelligent agent system, actuators are responsible for...", options: ["Gathering information from the environment", "Executing actions based on the decisions made", "Storing the agent's internal model of the world"], answer: 1, explanation: "Actuators are the physical or software components that execute the actions decided by the agent." },
        { q: "A chess game is an example of which type of environment in AI?", options: ["Partially Observable Environment", "Dynamic Environment", "Fully Observable Environment"], answer: 2, explanation: "Chess is fully observable because both players can see all pieces on the board at all times." },
        { q: "A self-driving car where visibility is limited by sensors or weather conditions is an example of...", options: ["Static Environment", "Partially Observable Environment", "Fully Observable Environment"], answer: 1, explanation: "A self-driving car operates in a partially observable environment because its sensors cannot see everything." },
        { q: "Simple Reflex Agents operate on...", options: ["A utility function that evaluates and ranks all possible actions", "A condition-action rule (if-then statements) with no memory or learning capability", "An internal model of the world to handle partially observable environments"], answer: 1, explanation: "Simple reflex agents use if-then rules based strictly on the current percept, lacking memory." },
        { q: "Which of the following is a DISADVANTAGE of Simple Reflex Agents?", options: ["They are too computationally expensive", "They require a well-defined utility function", "They cannot handle complex or dynamic environments and fail when memory or planning is needed"], answer: 2, explanation: "Because they lack memory and planning, simple reflex agents fail in complex or dynamic environments." },
        { q: "Goal-Based Agents make decisions by...", options: ["Reacting immediately to stimuli without future planning", "Evaluating how their actions align with predefined goals and planning future outcomes", "Using a utility function to maximize satisfaction metrics"], answer: 1, explanation: "Goal-based agents plan ahead and choose actions that help them reach a specific target state." },
        { q: "Utility-Based Agents differ from Goal-Based Agents in that they...", options: ["Work without any memory of past states", "Only function in fully observable environments", "Optimize for the best outcome by evaluating trade-offs, rather than just achieving a goal"], answer: 2, explanation: "Utility-based agents use a utility function to evaluate and choose the action with the highest expected satisfaction." },
        { q: "Model-Based Reflex Agents improve upon Simple Reflex Agents by...", options: ["Using only predefined rules without any memory", "Maintaining an internal model of the world to reason about the current state and handle partially observable environments", "Applying a utility function to rank all possible actions"], answer: 1, explanation: "Model-based agents maintain an internal state to track parts of the world they cannot currently see." },
        { q: "Search in AI works by...", options: ["Randomly selecting a solution from a predefined list", "Systematically exploring different possibilities to find the best solution, moving step-by-step through choices until reaching the goal", "Asking the user to provide the correct answer"], answer: 1, explanation: "AI search systematically explores different states or actions to find the best solution path." },
        { q: "Heuristics are defined in the lecture as...", options: ["Guaranteed algorithms that always find the optimal solution", "Rules of thumb that help AI make decisions faster by focusing on the most promising options", "Mathematical formulas that compute exact answers"], answer: 1, explanation: "Heuristics are rules of thumb that speed up decision-making by focusing on promising options." },
        { q: "According to the lecture, heuristics guarantee the optimal solution.", options: ["TRUE", "FALSE"], answer: 1, explanation: "Heuristics trade mathematical perfection for speed, so they do not always guarantee the optimal solution." },
        { q: "In the 8-puzzle example, the heuristic used by AI estimates which moves...", options: ["Use the most computational resources", "Reduce the number of misplaced tiles or bring the empty space closer to the goal tile", "Randomly try every tile without a guiding rule"], answer: 1, explanation: "The 8-puzzle heuristic estimates distance by counting how many tiles are misplaced from their goal positions." },
        { q: "In self-driving cars, heuristic-based decision-making allows the vehicle to react instantly to obstacles, prioritizing...", options: ["Fuel efficiency over all other concerns", "Safety over exhaustive route calculations", "Passenger comfort over speed"], answer: 1, explanation: "Heuristics allow self-driving cars to prioritize safety and react instantly rather than calculating every possible outcome." },
        { q: "The Minimax Algorithm is a decision-making strategy used in...", options: ["Medical diagnosis systems", "Competitive games like Chess and Tic-Tac-Toe, to help AI play smart by looking ahead at all possible moves", "Scheduling exam timetables"], answer: 1, explanation: "Minimax is used in zero-sum games to minimize the opponent's maximum possible payoff." },
        { q: "In the Minimax Algorithm, the MAX player is located at...", options: ["The leaves of the game tree", "The root of the game tree", "Alternating positions with MIN throughout the tree"], answer: 1, explanation: "The MAX player is at the root of the tree, trying to maximize the utility value." },
        { q: "Constraint Satisfaction Problems (CSPs) involve finding solutions that meet specific requirements or rules, prioritizing meeting the constraints rather than focusing on how to achieve a goal.", options: ["TRUE", "FALSE"], answer: 0, explanation: "CSPs focus on finding a state that satisfies all constraints, rather than the path taken to reach it." },
        { q: "Which of the following is a real-life example of a CSP given in the lecture?", options: ["Using heuristics to find the shortest Google Maps route", "Sudoku Puzzle - filling a grid so that each row, column, and subgrid contains unique numbers", "Training a neural network on labeled data"], answer: 1, explanation: "Sudoku is a classic CSP where variables are cells, domains are numbers 1-9, and constraints prevent repeats." },
        { q: "According to the lecture, CSPs break down problems into three parts. Which of the following is NOT one of them?", options: ["Variables", "Algorithms", "Domains"], answer: 1, explanation: "The three structural parts of a CSP are Variables, Domains, and Constraints, not Algorithms." },
        { q: "Utility in AI refers to...", options: ["The speed at which AI processes information", "The measure of how desirable an outcome is, helping AI make informed decisions by assigning values to potential outcomes", "The memory capacity of an AI system"], answer: 1, explanation: "Utility is a measure of how desirable an outcome is, helping AI make rational decisions." },
        { q: "How does AI handle uncertainty according to the lecture?", options: ["It waits for complete information before making any decision", "It uses probability and other models to estimate outcomes and analyzes patterns in past data to make predictions", "It asks the user for confirmation before every decision"], answer: 1, explanation: "AI uses probabilistic models to estimate likely outcomes when information is incomplete or noisy." },
        { q: "According to the Basic Probability Rule in the lecture, the sum of all probabilities must equal...", options: ["0", "0.5", "1 (100%)"], answer: 2, explanation: "The sum of probabilities for all mutually exclusive outcomes in a distribution must equal 1." },
        { q: "Bayesian Inference is a method where AI starts with an initial belief called a prior probability, and when new evidence appears, it updates this belief to get a more accurate probability called a posterior probability.", options: ["TRUE", "FALSE"], answer: 0, explanation: "Bayesian Inference updates a prior belief with new evidence to calculate a more accurate posterior probability." },
        { q: "Supervised learning is defined as...", options: ["Learning without any data", "A machine learning approach that uses labelled datasets to train algorithms", "A method that groups data without human intervention"], answer: 1, explanation: "Supervised learning trains algorithms using labeled datasets to map inputs to correct outputs." },
        { q: "In supervised learning, the two main tasks are...", options: ["Clustering and Dimensionality Reduction", "Encoding and Decoding", "Classification and Regression"], answer: 2, explanation: "Supervised learning is divided into classification (categorical) and regression (continuous) tasks." },
        { q: "Unsupervised learning is defined as...", options: ["Learning from labelled datasets with human supervision", "Learning through rewards and penalties from the environment", "Using algorithms to analyse and cluster unlabelled datasets to discover hidden patterns"], answer: 2, explanation: "Unsupervised learning analyzes unlabelled data to discover hidden patterns or groupings." },
        { q: "The two main tasks in Unsupervised Learning mentioned in the lecture are...", options: ["Classification and Regression", "Clustering and Dimensionality Reduction", "Training and Deployment"], answer: 1, explanation: "Clustering groups similar data, while dimensionality reduction simplifies features." },
        { q: "Reinforcement Learning is defined as...", options: ["Learning from pre-labelled datasets", "A subfield of ML where an agent learns to make decisions by interacting with an environment through trial and error", "A technique for grouping data based on similarities"], answer: 1, explanation: "RL agents learn by interacting with an environment and receiving rewards or penalties." },
        { q: "The correct order of the Machine Learning Pipeline as presented in the lecture is...", options: ["Selecting Model -> Gathering Data -> Preparing Data -> Deploying Model", "Gathering Data -> Preparing Data -> Selecting & Training Model -> Testing & Deploying Model", "Testing Model -> Gathering Data -> Training Model -> Preparing Data"], answer: 1, explanation: "The standard ML pipeline starts with data gathering, followed by preparation, model training, and finally testing/deployment." },
        { q: "According to the lecture, the typical split ratio for a training set in the ML pipeline is...", options: ["10-20%", "20-30%", "70-80%"], answer: 2, explanation: "Typically, 70-80% of data is used for training the model." },
        { q: "The R-squared metric in model evaluation is used for...", options: ["Classification tasks", "Clustering tasks", "Regression tasks"], answer: 2, explanation: "R-squared evaluates how well a regression model fits the data." },
        { q: "The Silhouette Score is used to evaluate...", options: ["How often a classification model is correct", "How well the model groups similar data points in clustering", "How closely the regression model follows real trends"], answer: 1, explanation: "The Silhouette Score evaluates how well data points fit within their assigned clusters." },
        { q: "Artificial Neural Networks (ANN) are best described as...", options: ["Database management systems for storing large files", "A type of machine learning model that mimics the human brain to learn and make decisions", "Programming tools used only for data cleaning"], answer: 1, explanation: "Artificial Neural Networks are inspired by the structure and function of the human brain." },
        { q: "The three main components (layers) of an ANN are...", options: ["Encoding Layer, Processing Layer, Decoding Layer", "Data Layer, Weight Layer, Bias Layer", "Input Layer, Hidden Layers, Output Layer"], answer: 2, explanation: "An ANN consists of an input layer, one or more hidden layers, and an output layer." },
        { q: "In an ANN, the Input Layer is responsible for...", options: ["Producing the final prediction of the network", "Adjusting the weights during backpropagation", "Collecting all input information and passing it along for processing"], answer: 2, explanation: "The input layer receives and passes data into the network for processing." },
        { q: "In the ANN working process, the 'loss function' is used to...", options: ["Select the best algorithm for the task", "Measure the difference between the predicted answer and the actual correct answer", "Collect training data from multiple sources"], answer: 1, explanation: "The loss function measures the difference between the network's prediction and the actual correct answer." },
        { q: "Backpropagation in an ANN is described in the lecture as...", options: ["The process of feeding data into the input layer", "The final prediction step after training is complete", "The ANN's way of correcting itself by going backwards through the network and adjusting weights"], answer: 2, explanation: "Backpropagation adjusts the network's weights by propagating the error backward from the output layer." },
                { q: "Deep Learning differs from traditional ML because it...", options: ["Requires no data", "Uses manual rules", "Learns features automatically through multiple layers", "Uses only linear models"], answer: 2, explanation: "Deep Learning automatically extracts features through multiple layers, unlike traditional ML which requires manual feature engineering." },
        { q: "A neural network that processes sequential data (text, time-series) is...", options: ["CNN", "RNN", "SVM", "k-means"], answer: 1, explanation: "RNNs are specifically designed to process sequential data by retaining memory of previous inputs." },
        { q: "CNNs are mainly used for...", options: ["Audio playback", "Vision and image processing", "Sorting numbers", "Compressing files"], answer: 1, explanation: "Convolutional Neural Networks (CNNs) are primarily used for image and visual data processing." },
        { q: "The process of moving input forward through the network is called...", options: ["Data cleaning", "Forward propagation", "Backpropagation", "Tokenization"], answer: 1, explanation: "Forward propagation is the process of passing input data through the network to generate an output." },
        { q: "The process of adjusting weights by sending error backward is...", options: ["Preprocessing", "Normalization", "Backpropagation", "Tokenization"], answer: 2, explanation: "Backpropagation adjusts weights by propagating the error backward through the network." },
        { q: "Deep learning requires large amounts of...", options: ["Food", "Heat", "Data and computational power", "Manual programming"], answer: 2, explanation: "Deep learning models require massive datasets and high computational power (GPUs/TPUs)." },
        { q: "RNNs are especially useful for...", options: ["Random guessing", "Static images", "Language translation and chatbots", "Hardware repair"], answer: 2, explanation: "RNNs are ideal for sequential data like language translation and chatbots due to their memory." },
        { q: "ANNs can recognize complex patterns.", options: ["TRUE", "FALSE"], answer: 0, explanation: "ANNs are highly capable of recognizing complex, non-linear patterns in data." },
        { q: "The output layer generates the final prediction of the network.", options: ["TRUE", "FALSE"], answer: 0, explanation: "The output layer produces the final prediction or classification result." },
        { q: "CNNs are not used in medical imaging.", options: ["TRUE", "FALSE"], answer: 1, explanation: "CNNs are widely used in medical imaging for detecting tumors and abnormalities." },
        { q: "RNNs have memory that helps them process sequences.", options: ["TRUE", "FALSE"], answer: 0, explanation: "RNNs have an internal memory that helps them process sequential data." },
        { q: "Deep learning models cannot work with big data.", options: ["TRUE", "FALSE"], answer: 1, explanation: "Deep learning models thrive on big data and require it for optimal performance." },
        { q: "Forward propagation occurs before backpropagation.", options: ["TRUE", "FALSE"], answer: 0, explanation: "Forward propagation generates the prediction, then backpropagation updates the weights." },
        { q: "ANNs always require labeled data.", options: ["TRUE", "FALSE"], answer: 1, explanation: "ANNs can also be used in unsupervised and reinforcement learning scenarios." },
        { q: "CNNs are inspired by the structure of the human eye.", options: ["TRUE", "FALSE"], answer: 0, explanation: "CNNs are inspired by the visual cortex of the human eye." },
        { q: "Deep learning automatically extracts features from data.", options: ["TRUE", "FALSE"], answer: 0, explanation: "Deep learning models automatically learn and extract relevant features from raw data." },
        { q: "Backpropagation improves the model by reducing errors.", options: ["TRUE", "FALSE"], answer: 0, explanation: "Backpropagation minimizes the loss function by adjusting weights to reduce errors." },
        { q: "Computer Vision is a field of AI that enables machines to...", options: ["Speak fluently", "Store large data", "Interpret and understand visual information", "Repair hardware"], answer: 2, explanation: "Computer Vision enables machines to interpret and understand visual information from the world." },

    // Dark Mode
    function toggleTheme() {
        const html = document.documentElement;
        const btn = document.getElementById('theme-toggle');
        if (html.getAttribute('data-theme') === 'dark') {
            html.setAttribute('data-theme', 'light');
            btn.textContent = '🌙';
            localStorage.setItem('theme', 'light');
        } else {
            html.setAttribute('data-theme', 'dark');
            btn.textContent = '☀️';
            localStorage.setItem('theme', 'dark');
        }
    }
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('theme-toggle').textContent = '☀️';
    }

    questions.sort(() => Math.random() - 0.5);
    let currentQuestionIndex = 0; let score = 0; let answered = false;

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn');
    const progressText = document.getElementById('progress-text');
    const liveScoreEl = document.getElementById('live-score');
    const feedbackStatus = document.getElementById('feedback-status');
    const explanationEl = document.getElementById('explanation');
    const quizMain = document.getElementById('quiz-main');
    const scoreScreen = document.getElementById('score-screen');
    const scoreCircle = document.getElementById('score-circle');
    const scoreMessage = document.getElementById('score-message');
    const progressBarEl = document.getElementById('progress-bar');

    function updateTopBar() {
        liveScoreEl.textContent = `⭐ Score: ${score}`;
        const progressPercent = (currentQuestionIndex / questions.length) * 100;
        progressBarEl.style.width = progressPercent + '%';
    }

    function loadQuestion() {
        answered = false;
        feedbackStatus.textContent = '';
        explanationEl.style.display = 'none';
        explanationEl.textContent = '';
        nextBtn.style.display = 'none';
        optionsEl.innerHTML = '';

        const currentQuestion = questions[currentQuestionIndex];
        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
        updateTopBar();

        questionEl.textContent = currentQuestion.q;

        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.classList.add('option-btn');
            button.textContent = option;
            button.onclick = () => selectOption(index);
            optionsEl.appendChild(button);
        });
    }

    function selectOption(selectedIndex) {
        if (answered) return;
        answered = true;

        const currentQuestion = questions[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        
        buttons.forEach((button, index) => {
            button.disabled = true;
            if (index === currentQuestion.answer) button.classList.add('correct');
            else if (index === selectedIndex) button.classList.add('wrong');
        });

        if (selectedIndex === currentQuestion.answer) {
            score++;
            feedbackStatus.textContent = "✅ Correct!";
            feedbackStatus.style.color = "var(--success)";
        } else {
            feedbackStatus.textContent = `❌ Incorrect. The correct answer is: ${currentQuestion.options[currentQuestion.answer]}`;
            feedbackStatus.style.color = "var(--error)";
        }

        if (currentQuestion.explanation) {
            explanationEl.textContent = `💡 Explanation: ${currentQuestion.explanation}`;
            explanationEl.style.display = 'block';
        } else {
            explanationEl.textContent = `💡 Explanation: No explanation provided.`;
            explanationEl.style.display = 'block';
        }

        updateTopBar();
        nextBtn.style.display = 'block';
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) loadQuestion();
        else showScore();
    };

    function showScore() {
        quizMain.style.display = 'none';
        scoreScreen.style.display = 'block';
        const percentage = Math.round((score / questions.length) * 100);
        scoreCircle.textContent = `${percentage}%`;
        scoreMessage.textContent = `You scored ${score} out of ${questions.length}`;
        let msg = "";
        if (percentage >= 90) msg = "Outstanding! You are ready for the exam! 🏆";
        else if (percentage >= 70) msg = "Great job! Just a little more review needed. 👍";
        else if (percentage >= 50) msg = "Good effort, but keep studying! 📚";
        else msg = "Don't worry, review the lectures and try again! 💪";
        scoreMessage.textContent += ` - ${msg}`;
    }

    loadQuestion();
</script>
